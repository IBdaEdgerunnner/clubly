<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CampusConnect</title>
  <!-- Tailwind CSS Output -->
  <link href="./output.css" rel="stylesheet">
  <!-- Local Offline Lucide Icons -->
  <script src="./lucide.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-800 antialiased flex flex-col font-sans relative overflow-x-hidden">

  <!-- BACKGROUND IMAGE WITH BLUE/DARK OVERLAY -->
  <div class="absolute inset-0 z-0">
    <img src="./image.jpg" alt="Campus Background" class="w-full h-full object-cover opacity-30" />
    <div class="absolute inset-0 bg-linear-to-br from-slate-950 via-indigo-950/80 to-slate-950"></div>
  </div>

  <!-- NAVIGATION HEADER -->
  <header class="relative z-10 w-full bg-transparent border-b border-white/10 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 font-bold text-xl text-white">
        <div class="p-2 bg-indigo-600 text-white rounded-xl">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <span>CampusConnect</span>
      </a>
      <a href="index.html" class="text-sm font-medium text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
      </a>
    </div>
  </header>

  <!-- MAIN REGISTER CARD CONTAINER -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div class="w-full max-w-lg bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/20">
      
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center mb-3 shadow-inner">
          <i data-lucide="user-plus" class="w-6 h-6"></i>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Create an Account</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Join the campus community and register for student activities.</p>
      </div>

      <!-- ROLE TOGGLE SWITCH -->
      <div class="bg-slate-100 p-1.5 rounded-2xl flex items-center mb-6 relative">
        <button id="student-tab" type="button" onclick="setRole('student')" class="flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-xl transition bg-white text-indigo-600 shadow-sm flex items-center justify-center gap-2">
          <i data-lucide="user" class="w-4 h-4"></i> Student
        </button>
        <button id="staff-tab" type="button" onclick="setRole('staff')" class="flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-xl transition text-slate-500 hover:text-slate-900 flex items-center justify-center gap-2">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Staff / Admin
        </button>
      </div>

      <!-- INLINE FORM FEEDBACK BANNER -->
      <div id="form-message" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold text-center"></div>

      <!-- REGISTER FORM -->
      <form id="register-form" class="space-y-4">
        
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Full Name</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="fullname-input" required placeholder="Enter your full name" 
              class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 text-slate-800 rounded-xl border border-slate-200 focus:bg-white focus:border-indigo-600 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label id="id-label" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Matric Number</label>
          <div class="relative">
            <i data-lucide="id-card" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input id="id-input" type="text" required placeholder="Enter your matric number" 
              class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 text-slate-800 rounded-xl border border-slate-200 focus:bg-white focus:border-indigo-600 focus:outline-none transition">
          </div>
        </div>

        <div id="dynamic-select-container">
          <label id="select-label" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Faculty / Department</label>
          <div class="relative">
            <i id="select-icon" data-lucide="building-2" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <select id="role-select" class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 text-slate-800 rounded-xl border border-slate-200 focus:bg-white focus:border-indigo-600 focus:outline-none transition">
              <option>Faculty of Natural & Applied Sciences</option>
              <option>Faculty of Arts & Social Sciences</option>
              <option>Faculty of Management Sciences</option>
              <option>Faculty of Admin</option>
              <option>Faculty of Education</option>
              <option>Faculty of Law</option>
            </select>
          </div>
        </div>

        <!-- Admin Passkey Field -->
        <div id="passkey-container" class="hidden">
          <label class="block text-xs font-bold uppercase tracking-wider text-indigo-600 mb-1.5">Admin Passkey</label>
          <div class="relative">
            <i data-lucide="key-round" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-indigo-500"></i>
            <input id="admin-passkey-input" type="password" placeholder="Enter security passkey" 
              class="w-full pl-10 pr-4 py-3 text-sm bg-indigo-50/50 text-slate-800 rounded-xl border border-indigo-200 focus:bg-white focus:border-indigo-600 focus:outline-none transition">
          </div>
          <p class="text-[11px] text-slate-400 mt-1">Required to verify administrative club registration privileges.</p>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
          <div class="relative">
            <i data-lucide="key-round" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="password-input" required placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 text-slate-800 rounded-xl border border-slate-200 focus:bg-white focus:border-indigo-600 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Confirm Password</label>
          <div class="relative">
            <i data-lucide="shield-check" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="confirm-password-input" required placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 text-slate-800 rounded-xl border border-slate-200 focus:bg-white focus:border-indigo-600 focus:outline-none transition">
          </div>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="terms" required class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
          <label for="terms" class="text-xs text-slate-500">I agree to the <a href="#" class="text-indigo-600 hover:underline">Terms & Conditions</a> of CampusConnect</label>
        </div>

        <!-- Submit Button with Loading IDs -->
        <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 mt-4">
          <span id="btn-text">Create Account</span>
          <i id="btn-icon" data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>

      <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs sm:text-sm text-slate-500">
        Already have an account? 
        <a href="login.html" class="font-bold text-indigo-600 hover:text-indigo-700 ml-1">Sign In</a>
      </div>

    </div>
  </main>

  <footer class="relative z-10 w-full py-6 text-center text-xs text-slate-400">
    &copy; 2026 CampusConnect. All rights reserved.
  </footer>

  <!-- FIREBASE & APP LOGIC SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-svBQ13G-1oyjocQUmmglIw2Djh4KF3g",
      authDomain: "clubly-ebe85.firebaseapp.com",
      projectId: "clubly-ebe85",
      storageBucket: "clubly-ebe85.firebasestorage.app",
      messagingSenderId: "604871007339",
      appId: "1:604871007339:web:4a5cedfc3ceb7ea3e9252e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_PASSKEY = "insideboy123";
    let currentRole = 'student';

    const studentFaculties = [
      "Faculty of Natural & Applied Sciences",
      "Faculty of Arts & Social Sciences",
      "Faculty of Management Sciences",
      "Faculty of Admin",
      "Faculty of Education",
      "Faculty of Law"
    ];

    const campusClubs = [
      { name: "Tech Innovators", slug: "tech-innovators" },
      { name: "Creative Arts Society", slug: "creative-arts" },
      { name: "Campus Sports Club", slug: "campus-sports" },
      { name: "Leadership & Development", slug: "leadership-dev" },
      { name: "Environmental Action Club", slug: "environmental-action" },
      { name: "Debate & Public Speaking", slug: "debate-club" },
      { name: "Literary & Book Club", slug: "literary-club" },
      { name: "Coding & Open Source Society", slug: "coding-society" },
      { name: "Chess & Board Games Club", slug: "chess-club" },
      { name: "Red Cross & First Aid Society", slug: "red-cross" }
    ];

    function showMessage(text, isError = true) {
      const msgEl = document.getElementById('form-message');
      msgEl.innerText = text;
      msgEl.className = isError 
        ? "mb-4 p-3 rounded-xl text-xs font-semibold text-center bg-rose-50 text-rose-600 border border-rose-200" 
        : "mb-4 p-3 rounded-xl text-xs font-semibold text-center bg-emerald-50 text-emerald-600 border border-emerald-200";
      msgEl.classList.remove('hidden');
    }

    function setLoading(isLoading) {
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnIcon = document.getElementById('btn-icon');

      if (isLoading) {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
        btnText.innerText = "Creating account...";
        btnIcon.setAttribute('data-lucide', 'loader-2');
        btnIcon.classList.add('animate-spin');
      } else {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        btnText.innerText = "Create Account";
        btnIcon.setAttribute('data-lucide', 'arrow-right');
        btnIcon.classList.remove('animate-spin');
      }
      lucide.createIcons();
    }

    window.setRole = function(role) {
      currentRole = role;
      const studentTab = document.getElementById('student-tab');
      const staffTab = document.getElementById('staff-tab');
      const idLabel = document.getElementById('id-label');
      const idInput = document.getElementById('id-input');
      const selectLabel = document.getElementById('select-label');
      const roleSelect = document.getElementById('role-select');
      const passkeyContainer = document.getElementById('passkey-container');
      const adminPasskeyInput = document.getElementById('admin-passkey-input');
      
      document.getElementById('form-message').classList.add('hidden');

      if (role === 'student') {
        studentTab.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-xl transition bg-white text-indigo-600 shadow-sm flex items-center justify-center gap-2";
        staffTab.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-xl transition text-slate-500 hover:text-slate-900 flex items-center justify-center gap-2";
        idLabel.innerText = "Matric Number";
        idInput.placeholder = "Enter your matric number";
        selectLabel.innerText = "Faculty / Department";
        passkeyContainer.classList.add('hidden');
        adminPasskeyInput.removeAttribute('required');

        roleSelect.innerHTML = studentFaculties.map(fac => `<option>${fac}</option>`).join('');
      } else {
        staffTab.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-xl transition bg-white text-indigo-600 shadow-sm flex items-center justify-center gap-2";
        studentTab.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-xl transition text-slate-500 hover:text-slate-900 flex items-center justify-center gap-2";
        idLabel.innerText = "Email";
        idInput.placeholder = "Enter your email";
        selectLabel.innerText = "Assigned Club Admin Role";
        passkeyContainer.classList.remove('hidden');
        adminPasskeyInput.setAttribute('required', 'true');

        roleSelect.innerHTML = campusClubs.map(club => `<option value="${club.slug}">Admin — ${club.name}</option>`).join('');
      }
    };

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullname-input').value;
      const identifier = document.getElementById('id-input').value;
      const selectionValue = document.getElementById('role-select').value;
      const password = document.getElementById('password-input').value;
      const confirmPassword = document.getElementById('confirm-password-input').value;

      if (password !== confirmPassword) {
        showMessage("Passwords do not match!");
        return;
      }

      let authEmail = identifier;
      if (currentRole === 'student') {
        authEmail = `${identifier.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase()}@campusconnect.nsuk.edu`;
      } else {
        const passkey = document.getElementById('admin-passkey-input').value;
        if (passkey !== ADMIN_PASSKEY) {
          showMessage("Invalid Admin Passkey! Access denied.");
          return;
        }
      }

      try {
        setLoading(true);
        showMessage("Authenticating your session...", false);
        
        const userCred = await createUserWithEmailAndPassword(auth, authEmail, password);
        const user = userCred.user;

        if (currentRole === 'student') {
          await setDoc(doc(db, "users", user.uid), {
            fullName: fullName,
            matricNumber: identifier,
            department: selectionValue,
            role: "student",
            createdAt: new Date().toISOString()
          });

          showMessage("Account created successfully! Redirecting...", false);
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);

        } else {
          await setDoc(doc(db, "users", user.uid), {
            fullName: fullName,
            email: identifier,
            assignedClubSlug: selectionValue,
            role: "admin",
            createdAt: new Date().toISOString()
          });

          showMessage("Admin account created successfully! Redirecting...", false);
          setTimeout(() => {
            window.location.href = `admin-dashboard.html?club=${selectionValue}`;
          }, 800);
        }

      } catch (err) {
        console.error("Registration error:", err);
        let errorMsg = err.message;
        if (err.code === 'auth/email-already-in-use') {
          errorMsg = "This Matric Number or Email is already registered. Try a different one or sign in.";
        }
        showMessage(errorMsg);
        setLoading(false);
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
